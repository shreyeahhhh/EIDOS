[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eidos"
version = "0.0.0"
description = "EIDOS — Execution Intelligence & Dynamic Orchestration System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
# D-116: LangGraph is an optional extra, also included in dev. Core installation and core
# tests never import it; only eidos.backends.langgraph does (D-115). The lower bound is the
# version the spike and conformance tests were verified against (V0.3 Step 4).
langgraph = [
    "langgraph>=1.2.11,<2",
]
dev = [
    "pytest",
    "eidos[langgraph]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests/support"]
# LangGraph pulls in langsmith, which registers a pytest plugin that would otherwise be loaded into every
# test session — including tests that never touch LangGraph — and hook every test call. It is inert unless
# asked, but nothing in EIDOS asks for it, so it is not loaded (V0.3 Step 4).
# Real-model tests call a real local model runtime, so they run only when selected with `-m real_model` (V0.4, D-136). They are
# deselected here, never skipped, and when selected they fail loudly if their configuration is missing.
addopts = "-p no:langsmith_plugin -m 'not real_model'"
markers = [
    "real_model: calls a real local model runtime; excluded from the default run, selected explicitly with -m real_model (D-136)",
]
testpaths = [
    "tests/unit",
    "tests/integration",
    "tests/protocol",
    "tests/scenarios",
]
