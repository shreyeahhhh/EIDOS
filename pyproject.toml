[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eidos"
version = "0.0.0"
description = "EIDOS — Execution Intelligence & Dynamic Orchestration System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
# D-116: LangGraph is an optional extra, also included in dev. Core installation and core
# tests never import it; only eidos.backends.langgraph does (D-115). The lower bound is the
# version the spike and conformance tests were verified against (V0.3 Step 4).
langgraph = [
    "langgraph>=1.2.11,<2",
]
# D-171: httpx is the one dependency eidos.a2a adds — no a2a-sdk. An optional extra, the same
# pattern as langgraph (D-116): core installation and core tests never import it; only
# eidos.a2a.transport does. The lower bound is the version verified against (V0.6 Step 5).
a2a = [
    "httpx>=0.27,<1",
]
# D-234 (V1.4): the HTTP boundary. FastAPI, an ASGI server and a JWT library are imported by eidos.api only (guarded); none is imported by the core or by
# eidos.service. Lower bounds are the versions verified against on 2026-09-26 (V1.4-B).
api = [
    "fastapi>=0.141.1,<1",
    "uvicorn>=0.54,<1",
    "pyjwt[crypto]>=2.15,<3",
]
# D-230 (V1.4): PostgreSQL persistence. psycopg 3 and its pool are imported by eidos.persistence only (guarded).
postgres = [
    "psycopg[binary,pool]>=3.3.6,<4",
]
dev = [
    "pytest",
    "eidos[langgraph]",
    "eidos[a2a]",
    "eidos[api]",
    "eidos[postgres]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"eidos.persistence" = ["migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests/support"]
# LangGraph pulls in langsmith, which registers a pytest plugin that would otherwise be loaded into every
# test session — including tests that never touch LangGraph — and hook every test call. It is inert unless
# asked, but nothing in EIDOS asks for it, so it is not loaded (V0.3 Step 4).
# Real-model tests call a real local model runtime, so they run only when selected with `-m real_model` (V0.4, D-136). They are
# deselected here, never skipped, and when selected they fail loudly if their configuration is missing.
# PostgreSQL tests need a real, disposable database (EIDOS_TEST_DATABASE_URL), so they run only when selected with `-m postgres`; they are deselected here, never skipped, and when selected they
# fail loudly if the database is missing (V1.4-B, D-230), exactly as the real-model tests do.
# Groq tests call the real, hosted Groq API and need a real GROQ_API_KEY, so they run only when selected with `-m groq` (V1.6); the
# same rule as real_model and postgres: deselected here, never skipped, and when selected they fail loudly if the key is missing.
addopts = "-p no:langsmith_plugin -m 'not real_model and not postgres and not groq'"
markers = [
    "real_model: calls a real local model runtime; excluded from the default run, selected explicitly with -m real_model (D-136)",
    "postgres: needs a real PostgreSQL database at EIDOS_TEST_DATABASE_URL; excluded from the default run, selected explicitly with -m postgres (D-230)",
    "groq: calls the real, hosted Groq API and needs a real GROQ_API_KEY; excluded from the default run, selected explicitly with -m groq (V1.6)",
]
testpaths = [
    "tests/unit",
    "tests/integration",
    "tests/protocol",
    "tests/scenarios",
]
